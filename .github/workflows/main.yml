name: Generate and deploy FeedAwake

on:
  workflow_dispatch:

  schedule:
    # 09:17 y 21:17 UTC
    # Aproximadamente 06:17 y 18:17 en Paraguay
    - cron: "17 9,21 * * *"

  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "awake1990-2000.csv"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Generate static page
        run: go run ./cmd/feedawake -locale T -count 10 -out docs/index.html

      - name: Verify generated page
        run: test -s docs/index.html

      - name: Configure Github Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Deploy page
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
